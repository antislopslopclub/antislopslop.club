<!doctype html>
<html lang="en" data-emojis="🚀 ✨ 🔥 🎯 🤖 ⚡ 📦 🧠 🎉 🛠️ 💡 🐛 🔍 ⚙️ 📚 ✅ 🌟 🧪 🎨 🚧 🔮 📈 💎 💻">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content=":emoji:" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg" />
    <script>
      if (navigator.vendor === "Apple Computer, Inc." && /Version\/\S+ (?:Mobile\/\S+ )?Safari\//.test(navigator.userAgent)) {
        const emojis = document.documentElement.dataset.emojis.split(" ");
        const emoji = emojis[Math.floor(Math.random() * emojis.length)];
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text x="32" y="47" text-anchor="middle" font-size="42">' + emoji + '</text></svg>';
        const link = document.querySelector('link[rel="icon"]');
        link.href = "data:image/svg+xml," + encodeURIComponent(svg);
        link.dataset.static = "true";
      }
    </script>
    <title>Anti-Slop Slop Club</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend.tsx"></script>
  </body>
</html>
